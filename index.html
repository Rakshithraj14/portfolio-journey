<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rakshith Raj M · MLOps &amp; AI Engineer</title>
    <meta name="description" content="MLOps and AI engineer in Bengaluru. Take a walk down the street: every building is a chapter." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Resolve day/night before first paint so the street never flashes the wrong sky.
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
